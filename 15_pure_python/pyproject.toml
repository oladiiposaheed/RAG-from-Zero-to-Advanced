[project]
name = "agrivoice"
version = "0.1.0"
description = "Voice-first AI for Nigerian farmers"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai",
    "langchain",
    "langchain-openai",
    "langchain-chroma",
    "chromadb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ipytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agrivoice*"]
